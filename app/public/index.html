<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>aleator 🎲 — cut-up machine</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1><span class="die" aria-hidden="true">🎲</span> aleator</h1>
    <p class="tagline">fold two feed sources into one cut-up, William S. Burroughs style.</p>

    <form id="cutup-form">
      <fieldset class="perm">
        <legend>Permutations — Gysin's dial</legend>
        <div class="perm-row">
          <input type="text" id="perm-input" placeholder="one phrase, rotated by every word…">
          <button type="button" id="perm-go">Perm</button>
        </div>
        <div id="perm-out" aria-live="polite"></div>
      </fieldset>

      <fieldset>
        <legend>Source A <span class="swatch swatch-a"></span></legend>
        <select id="feed-a"></select>
        <input type="url" id="url-a" placeholder="or paste a feed URL">
        <textarea id="text-a" placeholder="or paste raw text"></textarea>
        <label class="use-horde"><input type="checkbox" data-horde-slot="a"> fold from the word horde</label>
      </fieldset>

      <fieldset>
        <legend>Source B <span class="swatch swatch-b"></span></legend>
        <select id="feed-b"></select>
        <input type="url" id="url-b" placeholder="or paste a feed URL">
        <textarea id="text-b" placeholder="or paste raw text"></textarea>
        <label class="use-horde"><input type="checkbox" data-horde-slot="b"> fold from the word horde</label>
      </fieldset>

      <label for="lines">Lines: <input type="number" id="lines" min="1" max="24" value="8"></label>
      <label for="cut">Cut depth:
        <select id="cut">
          <option value="clause">clause</option>
          <option value="phrase" selected>phrase</option>
          <option value="word">word shrapnel</option>
        </select>
      </label>
      <div class="toggles">
        <label><input type="checkbox" id="fulltext"> Pull full articles</label>
        <label><input type="checkbox" id="typewriter" checked> Typewriter</label>
      </div>
      <button type="submit" id="go">Cut it up</button>
    </form>

    <button id="fold" type="button" hidden>Fold it in again</button>

    <section id="output" aria-live="polite"></section>

    <button id="stash-comp" type="button" hidden>✚ Stash whole composition</button>

    <details class="horde" id="horde-drawer">
      <summary>🎲 Word horde (<span id="horde-count">0</span>)</summary>
      <div class="horde-tools">
        <button type="button" id="horde-clear" hidden>empty the horde</button>
        <span class="horde-hint">click any fragment to stash it; click ✚ to stash a line</span>
      </div>
      <ul id="horde-list"></ul>
    </details>

    <details class="about">
      <summary>📖 About the machine</summary>
      <div class="about-body"></div>
    </details>
  </main>
  <script type="module" src="/main.js"></script>
</body>
</html>
